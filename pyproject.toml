[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "costumer-churn-risk-tool"
version = "0.1.0"
description = "A reproducible churn-risk model for predicting customer cancellations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.3",
    "scikit-learn==1.8.0",
    "optuna==4.8.0",
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "pydantic==2.13.4",
    "joblib==1.5.3",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "shap==0.51.0",
    "xgboost==3.2.0"
]

[tool.setuptools]
packages = ["src", "api"]
